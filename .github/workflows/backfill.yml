name: Backfill Histórico

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Data inicial (YYYY-MM-DD)"
        required: true
      end_date:
        description: "Data final (YYYY-MM-DD)"
        required: true

permissions:
  contents: write

concurrency:
  group: clipping-db
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Restaurar banco do branch 'data'
        run: bash scripts/restore_db.sh

      - name: Backfill (sem e-mail; achados marcados como 'backfill')
        env:
          INLABS_EMAIL: ${{ secrets.INLABS_EMAIL }}
          INLABS_PASSWORD: ${{ secrets.INLABS_PASSWORD }}
          START: ${{ inputs.start_date }}
          END: ${{ inputs.end_date }}
        run: python clip.py backfill --start "$START" --end "$END"

      - name: Persistir banco no branch 'data'
        if: always()
        run: bash scripts/persist_db.sh
