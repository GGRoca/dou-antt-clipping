# Clipping DOU - ANTT/SUFER

inlabs:
  email: ""     # vazio = usa Secret INLABS_EMAIL
  password: ""  # vazio = usa Secret INLABS_PASSWORD

lookback_days: 2

# ============================================================================
# FILTROS
#
# orgao      → substring de artCategory (hierarquia do DOU)
# art_types  → lista de artType exato; vazio = todos os tipos do órgão
#
# Hierarquia no DOU:
#   "Ministério dos Transportes"
#     └─ "Agência Nacional de Transportes Terrestres"  (artCategory contém só isso → publ. da ANTT/Diretoria)
#          └─ "Superintendência de Transporte Ferroviário"  (artCategory contém isso → publicações da SUFER)
#          └─ "Diretoria Colegiada"                         (artCategory contém isso → deliberações, etc.)
#
# Para pegar TUDO da SUFER, use orgao = "Superintendência de Transporte Ferroviário"
# Para pegar Deliberações da Diretoria, use orgao = "Diretoria Colegiada"
# ============================================================================

filtros:

  # Tudo que a SUFER publicar, qualquer artType
  - nome: "SUFER-Todas"
    secao: "DO1"
    orgao: "Superintendência de Transporte Ferroviário"
    art_types: []

  # Deliberações da Diretoria Colegiada
  - nome: "ANTT-Deliberacoes"
    secao: "DO1"
    orgao: "Diretoria Colegiada"
    art_types: ["Deliberação"]

  # Portarias (qualquer unidade da ANTT)
  - nome: "ANTT-Portarias"
    secao: "DO1"
    orgao: "Agência Nacional de Transportes Terrestres"
    art_types: ["Portaria"]

  # Instruções Normativas
  - nome: "ANTT-Instrucoes"
    secao: "DO1"
    orgao: "Agência Nacional de Transportes Terrestres"
    art_types: ["Instrução Normativa"]

  # Retificações
  - nome: "ANTT-Retificacoes"
    secao: "DO1"
    orgao: "Agência Nacional de Transportes Terrestres"
    art_types: ["Retificação"]

  # ── Exemplos (descomente para ativar) ──────────────────────────────────────

  # Tudo do Ministério dos Transportes (ministro, DG, etc.)
  # - nome: "MinTransportes-Todas"
  #   secao: "DO1"
  #   orgao: "Ministério dos Transportes"
  #   art_types: []

  # Resoluções da ANTT
  # - nome: "ANTT-Resolucoes"
  #   secao: "DO1"
  #   orgao: "Agência Nacional de Transportes Terrestres"
  #   art_types: ["Resolução"]

