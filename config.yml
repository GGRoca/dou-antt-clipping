# Clipping DOU - ANTT/SUFER
#
# Credenciais vêm dos GitHub Secrets (INLABS_EMAIL, INLABS_PASSWORD, SMTP_USER,
# SMTP_PASS). Os campos abaixo só servem para execução local.

inlabs:
  email: ""
  password: ""

# Janela de revarredura a cada execução: D-lookback_days ... D0.
# Edições extras podem aparecer com atraso e o INLABS pode ficar dias fora do ar;
# arquivos já processados não são baixados de novo (extras são re-checadas por
# tamanho), então uma janela maior custa só algumas listagens a mais.
lookback_days: 5

# E-mail "sem novidades" na primeira execução bem-sucedida de cada dia útil.
confirmacao_diaria: true

# Alerta por e-mail se o INLABS ficar inacessível por mais de N horas
# (no máximo 1 alerta por dia).
alerta_indisponibilidade_horas: 24

# ============================================================================
# FILTROS
#
# Cada <article> do XML do INLABS traz:
#   artCategory → hierarquia do órgão, ex.:
#     "Ministério dos Transportes/Agência Nacional de Transportes Terrestres/Superintendência de Transporte Ferroviário"
#   artType     → tipo do ato, ex.: "Portaria", "Deliberação", "Resolução", "Retificação", "Decisão"
#
# Unidades da ANTT vistas em artCategory (inspect de 28/08 a 16/09/2026) e seus tipos:
#   Diretoria Colegiada ............................ Deliberação, Resolução, Retificação
#   Gabinete do Diretor-Geral ...................... Portaria, Retificação
#   Superintendência de Transporte Ferroviário ..... Decisão
#   Superintendência de Infraestrutura Rodoviária .. Decisão (muitas), Portaria, Retificação
#   Sup. de Serviços de Transp. Rod. de Passageiros  Decisão (muitas), Retificação
#   Sup. de Serviços de Transp. Rod. e Multimodal de Cargas .. Decisão, Portaria
#   Sup. de Fiscalização de Serviços de Transp. Rod. ......... Decisão
#
#   orgao      → substring de artCategory (sem distinção de acentos/maiúsculas)
#   art_types  → lista de artType aceitos; vazia = todos os tipos do órgão
#
# Uma publicação pode casar com mais de um filtro (ex.: Portaria da SUFER casa
# com SUFER-Todas e ANTT-Portarias); ela aparece uma única vez no e-mail, com
# os nomes dos filtros.
#
# Para validar contra dados reais: Actions → Clipping Diário → Run workflow →
# comando "inspect" (lista os artCategory/artType do dia e o que cada filtro pega).
# ============================================================================

filtros:

  - nome: "SUFER-Todas"
    secao: "DO1"
    orgao: "Superintendência de Transporte Ferroviário"
    art_types: []

  - nome: "ANTT-Deliberacoes"
    secao: "DO1"
    orgao: "Diretoria Colegiada"
    art_types: ["Deliberação"]

  - nome: "ANTT-Portarias"
    secao: "DO1"
    orgao: "Agência Nacional de Transportes Terrestres"
    art_types: ["Portaria"]

  - nome: "ANTT-Instrucoes"
    secao: "DO1"
    orgao: "Agência Nacional de Transportes Terrestres"
    art_types: ["Instrução Normativa"]

  - nome: "ANTT-Retificacoes"
    secao: "DO1"
    orgao: "Agência Nacional de Transportes Terrestres"
    art_types: ["Retificação"]

  # Resoluções (atos normativos da Diretoria Colegiada)
  - nome: "ANTT-Resolucoes"
    secao: "DO1"
    orgao: "Agência Nacional de Transportes Terrestres"
    art_types: ["Resolução"]

  # Exemplos (descomente para ativar):
  # - nome: "MinTransportes-Todas"
  #   secao: "DO1"
  #   orgao: "Ministério dos Transportes"
  #   art_types: []

mail:
  smtp_host: "smtp.gmail.com"
  smtp_port: 587
  smtp_user: ""
  smtp_pass: ""
  from_email: "guilherme.artintel@gmail.com"
  to_emails:
    - "guiroca@gmail.com"
  subject_prefix: "[DOU][ANTT][SUFER]"

storage:
  db_path: "data/clipping.sqlite"
